name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Lint, types and tests
        run: bun run check
      - name: Documentation is in step with the code
        run: bun run docs:check
      - name: Build output of the demo (SEO tags, translations, no draft leaks)
        run: bun run check:build
      - name: Build the docs and the starter
        run: |
          bun run build:docs
          bun run --cwd apps/starter build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install the packed package into a new project
        run: bun run check:package
