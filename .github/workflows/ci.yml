name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Lint, types and tests
        run: bun run check
      - name: Documentation is in step with the code
        run: bun run docs:check
      - name: Build output of the demo (SEO tags, translations, no draft leaks)
        run: bun run check:build
      - name: Build the docs and the starter
        run: |
          bun run build:docs
          bun run --cwd apps/starter build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install the packed package into a new project
        run: bun run check:package

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Browser for the tests
        run: bunx playwright install --with-deps chromium
        working-directory: e2e
      - name: End-to-end tests (server build and static build of the demo)
        run: bun run e2e
      - name: Report and traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
